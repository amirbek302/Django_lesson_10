<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Price</title>
</head>
<body>
    <h2>Hello it's Price</h2>
    <h1>Список автомобилей:</h1>

    {% for car in cars %}
        <div class="car_card">
            <h2>{{ car.car_model }}</h2>
            <p>Описание: {{ car.car_description }}</p>
            <p>Марка: {{ car.car_make }}</p>

            {% if car.car_image %}
                <img src="{{ car.car_image }}" width="250">
            {% endif %}
        </div>
        <hr>
    {% empty %}
        <p>Пока автомобилей нет.</p>
    {% endfor %}
</body>
</html>
